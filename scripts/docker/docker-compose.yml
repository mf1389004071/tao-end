services:
  # 数据库服务 (PostgreSQL 16 + pgvector)
  bt10-db:
    image: pgvector/pgvector:pg16
    container_name: bt10-db
    # 本机 5432 常被其它容器占用，故映射 5433；应用侧用 jdbc:postgresql://127.0.0.1:5433/bt10
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: bt10
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Bt10@1234
      TZ: UTC
      PGTZ: UTC
    volumes:
      # 数据持久化映射到本地
      - ./data/db:/var/lib/postgresql/data
    restart: unless-stopped
