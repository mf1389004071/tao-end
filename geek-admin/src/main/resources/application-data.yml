# 配置文件存储
# 本地存储默认使用「当前项目运行目录/data/files/master」；可覆盖：在环境变量或 application.yml 中设置 storage.local.path
storage:
  primary: MASTER
  buckets:
    MASTER:
      # 指定文件服务类型(值为local代表使用本地作为文件操作服务,minio代表使用minio作为文件操作服务,oss代表使用oss作为文件操作服务)
      type: local
      permission: public
      path: ${storage.local.path:${user.dir}/data/files/master}
      # 建议public权限的api以 /profile开头就不需要再从SecurityConfig配置权限了
      # private需要自己编写一个api例如FileController中的/file/resource
      api: /profile/files/master
    # SLAVE1:
    #   type: minio
    #   permission: public
    #   url: http://localhost:9000
    #   accessKey: 
    #   secretKey: 
    #   bucketName: geek
    # SLAVE2:
    #   type: oss
    #   permission: public
    #   accessKeyId: accessKeyId
    #   accessKeySecret: accessKeySecret
    #   bucketName: geek
    #   endpoint: oss-cn-beijing.aliyuncs.com


# 数据池配置
spring:
  datasource:
    dynamic:
      primary: MASTER
      # dynamic.datasource.MASTER 在各环境 application-{dev,test,prod}.yml 中配置
      # SLAVE (MySQL 示例，多数据源时启用): 在对应 profile 的 yml 中增加 SLAVE 节点即可

    druid:
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      # 配置监控统计拦截的filters  stat=>监控统计 wall=>防SQL注入 slf4j log4j2=>日志记录
      filters: stat,wall,slf4j,log4j2
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

      # 配置spring监控的匹配类
      aop-patterns: com.geek.*.service.*,com.geek.*.mapper.*

      
      # Web应用 和 URL监控 配置
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
        session-stat-enable: false  # 是否开启session统计功能
          
      # 监控视图配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: true      # 是否可以重置日志
        login-username: geek   # 用户名
        login-password: 123456  # 密码
        allow: ""               # IP白名单 (没有配置或者为空，则允许所有访问)
        deny: ""                # IP黑名单 (存在共同时，deny优先于allow)
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true