# 请输入自己的appid和appsecret
oauth:
  wx:
    miniapp:
      # TODO(微信小程序快捷登录): 填你的微信小程序 AppID
      appId: appId
      # TODO(微信小程序快捷登录): 填你的微信小程序 AppSecret
      appSecret: appSecret
      url: https://api.weixin.qq.com/sns/jscode2session
    pub:
      # TODO(公众号网页授权/登录): 如需启用请填公众号 AppID（当前仓库 pub 登录实现仍需调整，见文档说明）
      appId: appId
      # TODO(公众号网页授权/登录): 如需启用请填公众号 AppSecret
      appSecret: appSecret
      url: https://api.weixin.qq.com/sns/oauth2/access_token

tfa:
  phone:
    dysms:
      # 阿里云 AccessKey ID
      accessKeyId: appId
      # 阿里云 AccessKey Secret
      accessKeySecret: appSecret
      # 短信模板
      template:
          VerificationCode:
            # 短信模板编码
            templateCode: SMS_123456789
            # 短信签名
            signName: 阿里云短信测试
            # 短信模板必需的数据名称，多个key以逗号分隔，此处配置作为校验
            keys: code

