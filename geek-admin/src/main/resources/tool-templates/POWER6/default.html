<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>潜能解读 · 默认模板</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;padding:16px;background:#f8fafc;color:#0f172a}
    .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(15,23,42,.06)}
    h1{font-size:18px;margin:0 0 8px}
    .meta{color:#64748b;font-size:12px;margin-bottom:12px}
    .dim{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9}
    .dim:last-child{border:0}
    .score{font-weight:800}
    .pos{color:#10b981}.neg{color:#ef4444}
    .ai{line-height:1.7;font-size:14px;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="card">
    <h1>{{subjectName}} 的潜能画像</h1>
    <div class="meta">模板：default · {{generatedAt}}</div>
    <div>{{scoresHtml}}</div>
  </div>
  <div class="card">
    <h1>AI 综合解读</h1>
    <div class="ai">{{aiNarrative}}</div>
  </div>
  <div class="card">
    <h1>行动建议</h1>
    <div class="ai">{{aiActions}}</div>
  </div>
</body>
</html>
